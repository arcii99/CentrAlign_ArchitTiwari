<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nova{% endblock %} · Nova console</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>

  <a class="brand" href="/">Nova <span>AP associate · Northwind Robotics</span></a>

<main>
{% block body %}{% endblock %}

</html>
