[project]
name = "ai-employee"
version = "0.1.0"
description = "Nova — an autonomous AI accounts-payable associate that operates a company's real systems, asks when it must, and proves its work."
requires-python = ">=3.12"
dependencies = [
    # mock company world
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # agent runtime
    "playwright>=1.55",
    "pypdf>=5.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
